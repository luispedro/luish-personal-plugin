description = "Luis Pedro's personal luish configuration."

[available]
"luish-extra" = { gh = "luispedro/luish-extra" }

[dependencies]
"luish-extra/completion/all" = { }
"luish-extra/themes" = { }
std.bash-completion = "*"
std.completion = "*"

[options]
autosuggest = true          # as zsh-autosuggestions
expand.braces = true        # as zsh's brace expansion
highlight.paths = true      # underline the words that name existing files as you type
vars.trace_after_startup = true  # trace all variables after startup (for debugging)

[options.cd]
auto = true                 # type a path and hit enter to cd into it

[options.pushd]
auto = true                 # pushd on every cd
ignore_dups = true          # but don't push a directory that's already on the stack
silent = true               # and don't print the stack after each cd

[options.prompt]
percent = true              # zsh's % sequences in PS1 (set in rc.lsh)

[options.glob]
star = true                 # globstar (**) support
bare_qualifiers = true      # allow bare qualifiers in globs, e.g. `*(.)` for files only

[options.history]
expand = true               # as zsh's history expansion (!!, !$, ...)
file = "~/.histfile"        # in zsh's format (zsh itself now uses ~/.zsh_history)
size = 10000                # as zsh's HISTSIZE (luish's default is 1000)
save_size = 10000           # as zsh's SAVEHIST
share = true
ignore_space = true
reduce_blanks = true
save_no_dups = true

[alias]
ls = "ls --color=auto"
open = "xdg-open"

[alias.global]
"..." = "../.."
"...." = "../../.."
"....." = "../../../.."
"......" = "../../../../.."
"......." = "../../../../../.."

